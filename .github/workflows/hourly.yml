name: Hourly rotation snapshot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rotation-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect this hour's snapshot
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_ENVIRONMENT: ${{ secrets.COINGECKO_ENVIRONMENT || 'pro' }}
        run: python run.py collect

      - name: Commit updated data
        run: |
          git config user.name "rotation-bot"
          git config user.email "rotation-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No data changes" || git commit -m "Hourly snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
